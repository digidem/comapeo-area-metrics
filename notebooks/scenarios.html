  <script id="1" type="text/markdown">
    # Generating realistic CoMapeo data

    This notebook generates random CoMapeo data in a way designed to reflect real-life usage. It's used by the [footprint](./footprint) and [extent](./extent) notebooks to demonstrate the algorithms used to estimate the area covered by a CoMapeo monitoring or mapping team. Scenarios use a basic (mullberry32) seeded PRNG.

    Each scenario comprises of three things:

    - **Territory**: a community's actual territory, as one or more polygons. Either natural boundaries (generated to resemble following a mountain range or river), or 4–7 sided polygons, each with a random aspect ratio and orientation. Territories are drawn from 100 to 10,000 km² with a median near 2,000 km².
    - **Access**: footpaths, rivers and roads which people use to move around their territory. These are used to restrict how collected data is generated: real-life monitoring data is restricted by the access routes within a territory.
    - **Patrols**: generated 1–4 day drips where a team would collect data along access routes. Walk at 4 km/h, 5—15km per day, recording observations in clusters on the way. 1/10 trips include a motorised leg (boat, vehicle) and ¼ of trips record a track.

    The area estimators only see the records (observations and tracks) generated by this data. The goal is to visualize the difference between the estimated area monitored and/or mapped, and the actual territory that might be monitored as part of a project.
  </script>

  <script id="38" type="module" pinned="">
    // Radius of the earth in meters
    const EARTH_RADIUS_M = 6371008.8;
    // Center for territories (Amazon rainforest)
    const BASE = [-62.2, -3.5];
    const DAY_MS = 24 * 3600 * 1000;
    const EPOCH = Date.UTC(2025, 0, 1);
    // Devices used for record generation
    const DEVICES = ["A", "B", "C", "D", "E"];
    const KM2 = 1e6;
  </script>
  <script id="39" type="text/markdown">
    ## Seeded random number generator

    Scenarios are randomly generated, but we use a seeded PNRG for reproducible data
  </script>
  <script id="35" type="module" pinned="">
    function seededRandom(seed) {
      let state = seed >>> 0;
      return () => {
        state = (state + 0x6d2b79f5) >>> 0;
        let t = state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const between = (rng, lo, hi) => lo + rng() * (hi - lo);
  </script>
  <script id="41" type="text/markdown">
    ## Coordinate & projection helpers

    Three coordinate systems are used:

    - **Generator metres.** The generator works in metres east and north of one base point in the Amazon (longitude -62.2, latitude -3.5). Territories, routes and walks are built here, where a metre is a metre and `polygonAreaM2` gives a territory's exact area
    - **Longitude and latitude.** Scenarios are published in unprojected lon and lat, reflecting real data from devices..
    - **Estimator metres.** To calculate areas we project the record set to meters: equirectangular about the median latitude of that record set.
  </script>
  <script id="42" type="module" pinned="">
    // Given x, y from origin BASE, calculate the lon, lat
    function lonLatFromBase([x, y]) {
      const [lon0, lat0] = BASE;
      const dLat = (y / EARTH_RADIUS_M) * (180 / Math.PI);
      const dLon =
        (x / (EARTH_RADIUS_M * Math.cos((lat0 * Math.PI) / 180))) * (180 / Math.PI);
      return [lon0 + dLon, lat0 + dLat];
    }

    // Flat-earth approximation of distance between two points
    function lonLatDistanceM([lon0, lat0], [lon1, lat1]) {
      const meanLat = ((lat0 + lat1) / 2) * (Math.PI / 180);
      const dx =
        (lon1 - lon0) * (Math.PI / 180) * EARTH_RADIUS_M * Math.cos(meanLat);
      const dy = (lat1 - lat0) * (Math.PI / 180) * EARTH_RADIUS_M;
      return Math.hypot(dx, dy);
    }

    // Approximate length of a coordinate array
    function lonLatLengthM(coords) {
      let total = 0;
      for (let i = 0; i + 1 < coords.length; i++)
        total += lonLatDistanceM(coords[i], coords[i + 1]);
      return total;
    }

    // Longitude and latitude into estimator metres. Equirectangular about the
    // mean latitude, taken over sorted coordinates so the mean does not depend on input
    // order.
    function metresProjection(coords) {
      const sorted = coords.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      let latSum = 0;
      for (const [, lat] of sorted) latSum += lat;
      const meanLatDeg = sorted.length ? latSum / sorted.length : BASE[1];
      const xScale =
        (EARTH_RADIUS_M * Math.cos((meanLatDeg * Math.PI) / 180) * Math.PI) / 180;
      const yScale = (EARTH_RADIUS_M * Math.PI) / 180;
      return {
        meanLatDeg,
        toMetres: ([lon, lat]) => [lon * xScale, lat * yScale]
      };
    }
  </script>
  <script id="43" type="text/markdown">
    ## Planar geometry

    Small helpers on polygons given as arrays of [x, y] metres: the shoelace area, a ray-casting point-in-polygon test, bounds, the distance from a point along a bearing to the far side of the polygon (used to size footpaths and tributaries so they stop short of the boundary), and clipping a line to the vertices that fall inside a polygon.

  </script>
  <script id="44" type="module" pinned="">
    function polygonAreaM2(polygon) {
      let sum = 0;
      for (let i = 0; i < polygon.length; i++) {
        const [x0, y0] = polygon[i];
        const [x1, y1] = polygon[(i + 1) % polygon.length];
        sum += x0 * y1 - x1 * y0;
      }
      return Math.abs(sum) / 2;
    }

    function pointInPolygon(x, y, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const [xi, yi] = polygon[i];
        const [xj, yj] = polygon[j];
        if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi)
          inside = !inside;
      }
      return inside;
    }

    function boundsOf(points) {
      const xs = points.map((p) => p[0]);
      const ys = points.map((p) => p[1]);
      return {
        minX: Math.min(...xs),
        maxX: Math.max(...xs),
        minY: Math.min(...ys),
        maxY: Math.max(...ys)
      };
    }

    // Distance from `origin` along `angle` to the farthest crossing of the polygon boundary.
    function rayToBoundary(polygon, [ox, oy], angle) {
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      let farthest = 0;
      for (let i = 0; i < polygon.length; i++) {
        const [ax, ay] = polygon[i];
        const [bx, by] = polygon[(i + 1) % polygon.length];
        const ex = bx - ax;
        const ey = by - ay;
        const denominator = dx * ey - dy * ex;
        if (Math.abs(denominator) < 1e-9) continue;
        const t = ((ax - ox) * ey - (ay - oy) * ex) / denominator;
        const u = ((ax - ox) * dy - (ay - oy) * dx) / denominator;
        if (t > 0 && u >= 0 && u <= 1) farthest = Math.max(farthest, t);
      }
      return farthest;
    }

    // Pieces of a line whose vertices lie inside the polygon.
    function clipLineToPolygon(line, polygon) {
      const pieces = [];
      let current = [];
      for (const point of line) {
        if (pointInPolygon(point[0], point[1], polygon)) current.push(point);
        else {
          if (current.length > 1) pieces.push(current);
          current = [];
        }
      }
      if (current.length > 1) pieces.push(current);
      return pieces;
    }
  </script>

  <script id="48" type="text/markdown">
    ## Access routes

    Routes are polylines in metres. `meanderPath` is a footpath: the heading drifts as a random walk but is pulled back towards its target direction, so it wanders without doubling back. `meanderLine` is a river or road: a sine meander plus a random drift about a straight heading. `crossingLine` lays a river or road across the whole territory along its long axis and clips it to the polygon. `wobblyLoop` is a patrol loop, a circle disturbed by harmonics. `alongPath` and `truncatePath` find positions and prefixes along a route.
  </script>
  <script id="49" type="module" pinned="">
    function pathLengthM(path) {
      let total = 0;
      for (let i = 1; i < path.length; i++)
        total += Math.hypot(
          path[i][0] - path[i - 1][0],
          path[i][1] - path[i - 1][1]
        );
      return total;
    }

    // Position and unit direction at a distance along a metre path.
    function alongPath(path, distanceM) {
      let remaining = distanceM;
      for (let i = 0; i + 1 < path.length; i++) {
        const dx = path[i + 1][0] - path[i][0];
        const dy = path[i + 1][1] - path[i][1];
        const segment = Math.hypot(dx, dy);
        if (remaining <= segment || i + 2 === path.length) {
          const t = segment === 0 ? 0 : Math.min(1, remaining / segment);
          return {
            point: [path[i][0] + dx * t, path[i][1] + dy * t],
            direction: [dx / (segment || 1), dy / (segment || 1)]
          };
        }
        remaining -= segment;
      }
      return {point: path[path.length - 1], direction: [1, 0]};
    }

    function truncatePath(path, lengthM) {
      const out = [path[0]];
      let total = 0;
      for (let i = 1; i < path.length && total < lengthM; i++) {
        total += Math.hypot(
          path[i][0] - path[i - 1][0],
          path[i][1] - path[i - 1][1]
        );
        out.push(path[i]);
      }
      return out;
    }

    // A footpath: heading drifts as a random walk but is pulled back towards the
    // target direction, so the path wanders without doubling back.
    function meanderPath(
      rng,
      origin,
      angle,
      lengthM,
      {stepM = 100, wiggle = 0.5} = {}
    ) {
      const path = [origin];
      let heading = angle;
      let [x, y] = origin;
      for (let s = stepM; s <= lengthM; s += stepM) {
        heading += (rng() - 0.5) * wiggle + (angle - heading) * 0.15;
        x += stepM * Math.cos(heading);
        y += stepM * Math.sin(heading);
        path.push([x, y]);
      }
      return path;
    }

    // A river or road: heading `angle` from `start` for `lengthM` with a sine meander
    // plus a random drift.
    function meanderLine(
      rng,
      [x0, y0],
      angle,
      lengthM,
      amplitudeM,
      wavelengthM,
      stepM = 200
    ) {
      const line = [];
      let drift = 0;
      for (let s = 0; s <= lengthM; s += stepM) {
        drift += (rng() * 2 - 1) * 40;
        const across =
          amplitudeM * Math.sin((2 * Math.PI * s) / wavelengthM) + drift;
        line.push([
          x0 + s * Math.cos(angle) - across * Math.sin(angle),
          y0 + s * Math.sin(angle) + across * Math.cos(angle)
        ]);
      }
      return line;
    }

    // A line crossing the whole territory along its long axis at a fraction of its width,
    // clipped to the territory. Returns pieces in metres.
    function crossingLine(rng, shape, widthFraction, amplitudeM, wavelengthM) {
      const {minX, maxX, minY, maxY} = shape.localBounds;
      const y0 = minY + widthFraction * (maxY - minY);
      const local = meanderLine(
        rng,
        [minX - 2000, y0],
        0,
        maxX - minX + 4000,
        amplitudeM,
        wavelengthM
      );
      return clipLineToPolygon(local.map(shape.toMetres), shape.polygon);
    }

    function wobblyLoop(rng, centre, perimeterM) {
      const meanRadius = perimeterM / (2 * Math.PI);
      const harmonics = [2, 3, 4, 5].map((k) => ({
        k,
        amplitude: 0.04 + rng() * 0.1,
        phase: rng() * 2 * Math.PI
      }));
      const loop = [];
      for (let i = 0; i < 200; i++) {
        const theta = (i / 200) * 2 * Math.PI;
        let r = 1;
        for (const h of harmonics)
          r += h.amplitude * Math.sin(h.k * theta + h.phase);
        loop.push([
          centre[0] + meanRadius * r * Math.cos(theta),
          centre[1] + meanRadius * r * Math.sin(theta)
        ]);
      }
      loop.push(loop[0]);
      return loop;
    }
  </script>
  <script id="50" type="text/markdown">
    ## Observations

    An observation is a position in metres, a device letter and a timestamp; `finish` converts positions to longitude and latitude at the end. Settlements get some everyday records spread over a disc around them; everything else comes from patrols. Recorded tracks are the day's route with a few metres of GPS jitter.
  </script>
  <script id="51" type="module" pinned="">
    function observation([x, y], device, time) {
      return {x, y, device, time};
    }

    function pickDevice(rng, count, offset = 0) {
      return DEVICES[offset + Math.floor(rng() * count)];
    }

    function timeOfDay(day, hour) {
      return EPOCH + day * DAY_MS + hour * 3600 * 1000;
    }

    function randomTime(rng, firstDay, dayCount) {
      return timeOfDay(firstDay + Math.floor(rng() * dayCount), 6 + rng() * 12);
    }

    function discObservations(
      rng,
      centre,
      radiusM,
      count,
      {devices = 3, deviceOffset = 0, firstDay = 0, days = 90} = {}
    ) {
      const points = [];
      for (let i = 0; i < count; i++) {
        const r = radiusM * Math.sqrt(rng());
        const angle = rng() * 2 * Math.PI;
        points.push(
          observation(
            [centre[0] + r * Math.cos(angle), centre[1] + r * Math.sin(angle)],
            pickDevice(rng, devices, deviceOffset),
            randomTime(rng, firstDay, days)
          )
        );
      }
      return points;
    }

    function jitterLine(rng, line, jitterM) {
      return line.map(([x, y]) => [
        x + (rng() * 2 - 1) * jitterM,
        y + (rng() * 2 - 1) * jitterM
      ]);
    }
  </script>
  <script id="52" type="text/markdown">
    ## Patrols

    This is the heart of the generator, because it is where the data starts to look like data from the field. A patrol day is one device walking at 4 km/h from 07:00. Daily distance is 5 to 15 km, capped at 2 km times the square root of the area in km², so a 1 km² village gets walks of 1 to 2 km and anything over 56 km² gets the full range.

    Trips have a purpose. From a settlement, a **roaming trip** is one of three kinds: an out-and-back day that heads in one direction and comes home by a different meander; a loop of the day's length around an area, starting and ending at the settlement; or an expedition of two to four days that walks outward for one or two days and then home, the only way to reach the edge of a large territory. A **motorised trip** (about one in ten) rides to a distant part of the territory, walks a loop there, and rides back, with no observations during the ride. Where access is a river or a road, a **route trip** walks a stretch of it, and on a motorised day rides 10 to 30 km along it between two walked stretches.

    `meanderInside` keeps a walk inside the territory by turning for home when a step would leave it; `meanderTowards` walks home with wander that dies away as it gets close. `patrolDay` places the day's observations on the walked legs at the time the patrol reached each point. `patrolCampaign` schedules trips over a period on free days and stamps devices, times and tracks. `villageCampaign` adds a settlement's everyday records to a campaign of roaming trips from it.

  </script>
  <script id="53" type="module" pinned="">
    const WALK_KMH = 4;
    const MOTOR_KMH = 25;
    const WALK_LENGTH_M = [5000, 15000];

    function dailyWalkM(rng, areaKm2) {
      const cap = Math.min(
        WALK_LENGTH_M[1],
        Math.max(2000, 2000 * Math.sqrt(areaKm2))
      );
      return between(rng, Math.min(WALK_LENGTH_M[0], cap * 0.5), cap);
    }

    // A walk that keeps roughly to `angle` with some wander, turning for home when the
    // next step would leave the territory.
    function meanderInside(
      rng,
      polygon,
      start,
      angle,
      lengthM,
      home = start,
      {stepM = 100, wiggle = 0.5} = {}
    ) {
      const path = [start];
      let target = angle;
      let heading = angle;
      let [x, y] = start;
      for (let s = stepM; s <= lengthM; s += stepM) {
        heading += (rng() - 0.5) * wiggle + (target - heading) * 0.1;
        let nx = x + stepM * Math.cos(heading);
        let ny = y + stepM * Math.sin(heading);
        if (!pointInPolygon(nx, ny, polygon)) {
          target = Math.atan2(home[1] - y, home[0] - x) + (rng() - 0.5);
          heading = target;
          nx = x + stepM * Math.cos(heading);
          ny = y + stepM * Math.sin(heading);
          if (!pointInPolygon(nx, ny, polygon)) continue;
        }
        [x, y] = [nx, ny];
        path.push([x, y]);
      }
      return path;
    }

    // A walk home: heads for `to` with wander that dies away as it gets close, and stops
    // there or after `maxLengthM`. Steps that would leave the territory are turned aside.
    function meanderTowards(
      rng,
      from,
      to,
      maxLengthM,
      polygon = null,
      {stepM = 100, wiggle = 0.8} = {}
    ) {
      const path = [from];
      let [x, y] = from;
      let heading = Math.atan2(to[1] - y, to[0] - x);
      for (let s = stepM; s <= maxLengthM; s += stepM) {
        const remaining = Math.hypot(to[0] - x, to[1] - y);
        if (remaining <= stepM) {
          path.push(to);
          break;
        }
        const bearing = Math.atan2(to[1] - y, to[0] - x);
        const pull = Math.min(1, (3 * stepM) / remaining);
        heading +=
          (rng() - 0.5) * wiggle * (1 - pull) +
          (bearing - heading) * (0.15 + 0.85 * pull);
        let moved = false;
        for (const turn of [0, 0.6, -0.6, 1.2, -1.2, 1.8, -1.8]) {
          const nx = x + stepM * Math.cos(heading + turn);
          const ny = y + stepM * Math.sin(heading + turn);
          if (polygon && !pointInPolygon(nx, ny, polygon)) continue;
          [x, y] = [nx, ny];
          heading += turn;
          moved = true;
          break;
        }
        if (moved) path.push([x, y]);
      }
      return path;
    }

    // A motorised transfer: near enough straight between two points.
    function transitPath(rng, from, to, stepM = 200) {
      const steps = Math.max(
        1,
        Math.ceil(Math.hypot(to[0] - from[0], to[1] - from[1]) / stepM)
      );
      const path = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const jitter = i === 0 || i === steps ? 0 : 30;
        path.push([
          from[0] + (to[0] - from[0]) * t + (rng() - 0.5) * jitter,
          from[1] + (to[1] - from[1]) * t + (rng() - 0.5) * jitter
        ]);
      }
      return path;
    }

    // The part of a route between two distances along it, in travel order.
    function subPath(route, fromM, toM) {
      const [a, b] = fromM <= toM ? [fromM, toM] : [toM, fromM];
      const path = [alongPath(route, a).point];
      let travelled = 0;
      for (let i = 1; i < route.length; i++) {
        travelled += Math.hypot(
          route[i][0] - route[i - 1][0],
          route[i][1] - route[i - 1][1]
        );
        if (travelled > a && travelled < b) path.push(route[i]);
      }
      path.push(alongPath(route, b).point);
      return fromM <= toM ? path : path.reverse();
    }

    function nearestDistanceAlong(route, [px, py]) {
      let best = 0;
      let bestDistance = Infinity;
      let travelled = 0;
      for (let i = 0; i < route.length; i++) {
        if (i > 0)
          travelled += Math.hypot(
            route[i][0] - route[i - 1][0],
            route[i][1] - route[i - 1][1]
          );
        const d = Math.hypot(route[i][0] - px, route[i][1] - py);
        if (d < bestDistance) [best, bestDistance] = [travelled, d];
      }
      return best;
    }

    // A loop of about `lengthM` starting and ending at `from`, or null if it would leave the territory.
    function loopFrom(rng, polygon, from, lengthM) {
      const radius = lengthM / (2 * Math.PI);
      const angle = rng() * 2 * Math.PI;
      const loop = wobblyLoop(
        rng,
        [from[0] + radius * Math.cos(angle), from[1] + radius * Math.sin(angle)],
        lengthM
      );
      if (!loop.every(([x, y]) => pointInPolygon(x, y, polygon))) return null;
      let nearest = 0;
      loop.forEach((p, i) => {
        if (
          Math.hypot(p[0] - from[0], p[1] - from[1]) <
          Math.hypot(loop[nearest][0] - from[0], loop[nearest][1] - from[1])
        )
          nearest = i;
      });
      const rotated = [...loop.slice(nearest, -1), ...loop.slice(0, nearest)];
      return [from, ...rotated, from];
    }
  </script>
  <script id="54" type="module" pinned="">
    // A trip that roams the territory from a settlement: an out-and-back day, a loop day,
    // or an expedition of two to four days. A motorised trip rides to another part of the
    // territory, walks a loop there, and rides back. Returns one array of legs per day.
    function roamingTrip(
      rng,
      {polygon, base, areaKm2, motorised, transit = transitPath, kind}
    ) {
      const dayLength = () => dailyWalkM(rng, areaKm2);
      if (motorised) {
        const far = uniformInPolygon(rng, polygon, 1)[0];
        const walk =
          loopFrom(rng, polygon, far, dayLength()) ??
          outAndBack(rng, polygon, far, dayLength());
        return [
          [
            {path: transit(rng, base, far), motorised: true},
            {path: walk, motorised: false},
            {path: transit(rng, far, base), motorised: true}
          ]
        ];
      }
      const roll = rng();
      const chosen =
        kind ??
        (roll < 0.45 ? "out and back" : roll < 0.75 ? "loop" : "expedition");
      if (chosen === "out and back")
        return [
          [{path: outAndBack(rng, polygon, base, dayLength()), motorised: false}]
        ];
      if (chosen === "loop")
        return [
          [
            {
              path:
                loopFrom(rng, polygon, base, dayLength()) ??
                outAndBack(rng, polygon, base, dayLength()),
              motorised: false
            }
          ]
        ];
      // Expedition: one or two days outward in one direction, then the same number back.
      const outDays = 1 + Math.floor(rng() * 2);
      const angle = rng() * 2 * Math.PI;
      const days = [];
      let position = base;
      for (let d = 0; d < outDays; d++) {
        const leg = meanderInside(
          rng,
          polygon,
          position,
          angle + (rng() - 0.5) * 0.4,
          dayLength(),
          base
        );
        position = leg[leg.length - 1];
        days.push([{path: leg, motorised: false}]);
      }
      for (let d = 0; d < outDays; d++) {
        const last = d === outDays - 1;
        const leg = last
          ? meanderTowards(rng, position, base, 3 * WALK_LENGTH_M[1], polygon)
          : meanderTowards(rng, position, base, dayLength(), polygon);
        position = leg[leg.length - 1];
        days.push([{path: leg, motorised: false}]);
      }
      return days;
    }

    function outAndBack(rng, polygon, base, lengthM) {
      const out = meanderInside(
        rng,
        polygon,
        base,
        rng() * 2 * Math.PI,
        lengthM / 2,
        base
      );
      const back = meanderTowards(rng, out[out.length - 1], base, lengthM, polygon);
      return [...out, ...back.slice(1)];
    }

    // A one-day trip along access routes (rivers, a road). A motorised day rides 10 to
    // 30 km along the route between two walked stretches.
    function routeTrip(rng, routes, motorised) {
      const lengths = routes.map(pathLengthM);
      const total = lengths.reduce((a, b) => a + b, 0);
      let pick = rng() * total;
      let index = 0;
      while (index + 1 < routes.length && pick > lengths[index])
        pick -= lengths[index++];
      const route = routes[index];
      const routeLength = lengths[index];
      const clamp = (d) => Math.max(0, Math.min(routeLength, d));
      const direction = rng() < 0.5 ? 1 : -1;
      const walk = between(rng, ...WALK_LENGTH_M);
      const a = rng() * routeLength;
      if (!motorised)
        return [
          [{path: subPath(route, a, clamp(a + direction * walk)), motorised: false}]
        ];
      const b = clamp(a + direction * walk * 0.4);
      const c = clamp(b + direction * between(rng, 10000, 30000));
      const d = clamp(c + direction * walk * 0.6);
      return [
        [
          {path: subPath(route, a, b), motorised: false},
          {path: subPath(route, b, c), motorised: true},
          {path: subPath(route, c, d), motorised: false}
        ]
      ];
    }
  </script>
  <script id="55" type="module" pinned="">
    // One patrol day: observations fall on the walked legs only, at the time the patrol
    // reached that point; the returned route is the whole day, motorised legs included.
    function patrolDay(
      rng,
      legs,
      {day, device, count, jitterM = 20, startHour = 7}
    ) {
      let elapsedH = 0;
      const timed = legs.map((leg) => {
        const lengthM = pathLengthM(leg.path);
        const speedKmh = leg.motorised ? MOTOR_KMH : WALK_KMH;
        const info = {...leg, lengthM, speedKmh, startH: elapsedH};
        elapsedH += lengthM / 1000 / speedKmh;
        return info;
      });
      const walked = timed.filter((leg) => !leg.motorised && leg.lengthM > 0);
      const walkedM = walked.reduce((sum, leg) => sum + leg.lengthM, 0);
      const points = [];
      for (let i = 0; i < count && walkedM > 0; i++) {
        let along = rng() * walkedM;
        let leg = walked[0];
        for (const candidate of walked) {
          leg = candidate;
          if (along <= candidate.lengthM) break;
          along -= candidate.lengthM;
        }
        const {point} = alongPath(leg.path, along);
        const hour = startHour + leg.startH + along / 1000 / leg.speedKmh;
        points.push(
          observation(
            [
              point[0] + (rng() * 2 - 1) * jitterM,
              point[1] + (rng() * 2 - 1) * jitterM
            ],
            device,
            timeOfDay(day, hour)
          )
        );
      }
      return {points, route: legs.flatMap((leg) => leg.path)};
    }

    // A campaign of trips. `tripFor(rng, motorised, day)` returns one array of legs per day
    // of the trip; the campaign schedules trips on free days and stamps the records.
    function patrolCampaign(
      rng,
      {
        days,
        firstDay = 0,
        patrolShare,
        devices = 3,
        motorisedShare = 0.1,
        trackShare = 0.25,
        observationsPerDay,
        jitterM = 20,
        tripFor
      }
    ) {
      const points = [];
      const tracks = [];
      const summary = {
        patrolDays: 0,
        trips: 0,
        multiDayTrips: 0,
        motorisedTrips: 0,
        trackedTrips: 0
      };
      const [lo, hi] = observationsPerDay;
      for (let day = 0; day < days; day++) {
        if (rng() >= patrolShare) continue;
        const motorised = rng() < motorisedShare;
        const trip = tripFor(rng, motorised, day)
          .map((legs) => legs.filter((leg) => leg.path.length > 1))
          .filter((legs) => legs.length > 0);
        if (trip.length === 0) continue;
        const device = pickDevice(rng, devices);
        const recordTrack = rng() < trackShare;
        trip.forEach((legs, offset) => {
          const count = lo + Math.floor(rng() * (hi - lo + 1));
          const patrol = patrolDay(rng, legs, {
            day: firstDay + day + offset,
            device,
            count,
            jitterM
          });
          points.push(...patrol.points);
          if (recordTrack)
            tracks.push({
              device,
              time: timeOfDay(firstDay + day + offset, 7),
              coords: jitterLine(rng, patrol.route, 5)
            });
        });
        summary.patrolDays += trip.length;
        summary.trips++;
        if (trip.length > 1) summary.multiDayTrips++;
        if (motorised) summary.motorisedTrips++;
        if (recordTrack) summary.trackedTrips++;
        day += trip.length - 1;
      }
      return {points, tracks, ...summary};
    }

    function describeCollection(...campaigns) {
      const total = (key) => campaigns.reduce((sum, c) => sum + c[key], 0);
      return `${total("trips")} patrol trips over ${total("patrolDays")} days (${total("multiDayTrips")} of them multi-day), ${total("motorisedTrips")} with a motorised leg, ${total("trackedTrips")} with a recorded track`;
    }

    // A settlement with its everyday records plus a campaign of roaming trips from it.
    function villageCampaign(
      rng,
      shape,
      base,
      {
        days = 90,
        firstDay = 0,
        patrolShare = 0.5,
        devices = 3,
        motorisedShare = 0.1,
        villageRecords = 40,
        observationsPerDay = [3, 6],
        transit
      } = {}
    ) {
      const campaign = patrolCampaign(rng, {
        days,
        firstDay,
        patrolShare,
        devices,
        motorisedShare,
        observationsPerDay,
        tripFor: (r, motorised) =>
          roamingTrip(r, {
            polygon: shape.polygon,
            base,
            areaKm2: shape.areaKm2,
            motorised,
            transit
          })
      });
      const village = discObservations(rng, base, 400, villageRecords, {
        devices,
        firstDay,
        days
      });
      return {
        ...campaign,
        points: [...village, ...campaign.points],
        villageRecords
      };
    }
  </script>

    ## Assembling a scenario

    `finish` converts a metre-space draft into the scenario the estimator notebooks consume: observations and tracks in longitude and latitude, the territory polygons with their exact area, the access routes, any water, and a one-line description of how the records were collected.

  <script id="58" type="module" pinned="">
    // Convert a metre-space draft into the lon/lat scenario the notebooks consume.
    function finish({
      points = [],
      tracks = [],
      territory = [],
      routes = [],
      water = null,
      collection = ""
    }) {
      return {
        points: points.map(({x, y, device, time}) => {
          const [lon, lat] = lonLatFromBase([x, y]);
          return {lon, lat, device, time};
        }),
        tracks: tracks.map((t) => ({
          device: t.device,
          time: t.time,
          coords: t.coords.map(lonLatFromBase)
        })),
        territory: territory.map((polygon) => polygon.map(lonLatFromBase)),
        territoryKm2:
          territory.reduce((sum, polygon) => sum + polygonAreaM2(polygon), 0) / KM2,
        routes: routes.map((r) => ({
          kind: r.kind,
          coords: r.coords.map(lonLatFromBase)
        })),
        water: water ? water.map(lonLatFromBase) : null,
        collection
      };
    }
  </script>

  <script id="33" type="module" pinned="">
    const COMMUNITY =
      "a community territory (100 to 10,000 km², median near 2,000)";

    // One settlement in a community territory with trips from it; shared by the scenarios
    // that vary the records of the same base, so their figures can be compared directly.
    function villageBase(rng, options) {
      const shape = territoryShape(rng, {areaKm2: communityAreaKm2(rng)});
      const base = settlementIn(rng, shape);
      const campaign = villageCampaign(rng, shape, base, options);
      return {shape, base, campaign};
    }

    // A round no-go area of the given radius, wholly inside the territory with room to walk
    // around it, and at least a kilometre clear of the settlement.
    function noGoArea(rng, shape, base, radiusM) {
      const fits = (centre) =>
        Math.hypot(centre[0] - base[0], centre[1] - base[1]) > radiusM + 1000 &&
        d3.range(0, 360, 10).every((degrees) => {
          const angle = (degrees * Math.PI) / 180;
          return pointInPolygon(
            centre[0] + (radiusM + 700) * Math.cos(angle),
            centre[1] + (radiusM + 700) * Math.sin(angle),
            shape.polygon
          );
        });
      let centre = shape.toMetres([0, 0]);
      for (let i = 0; i < 200 && !fits(centre); i++)
        [centre] = uniformInPolygon(rng, shape.polygon, 1);
      return {centre, radiusM};
    }

    // Records inside a no-go area are removed, and tracks are cut where they cross it.
    function keepOutside({points, tracks}, {centre, radiusM}) {
      const outside = ([x, y]) =>
        Math.hypot(x - centre[0], y - centre[1]) > radiusM;
      const pieces = [];
      for (const track of tracks) {
        let piece = [];
        for (const coord of [...track.coords, null]) {
          if (coord && outside(coord)) piece.push(coord);
          else {
            if (piece.length > 1) pieces.push({...track, coords: piece});
            piece = [];
          }
        }
      }
      return {points: points.filter((p) => outside([p.x, p.y])), tracks: pieces};
    }

    // A walk around a no-go area that wanders up to 500 m outside its edge, clipped to the territory.
    function boundaryLegs(rng, {centre, radiusM}, polygon) {
      let offsetM = rng() * 500;
      const ring = d3.range(0, 361, 3).map((degrees) => {
        const angle = (degrees * Math.PI) / 180;
        offsetM = Math.max(0, Math.min(500, offsetM + (rng() - 0.5) * 300));
        return [
          centre[0] + (radiusM + offsetM) * Math.cos(angle),
          centre[1] + (radiusM + offsetM) * Math.sin(angle)
        ];
      });
      return clipLineToPolygon(ring, polygon).map((path) => ({
        path,
        motorised: false
      }));
    }

    const scenarioCatalogue = [
      {
        name: "Village territory",
        seed: 1,
        tests: `One settlement in ${COMMUNITY}, with three months of trips from it: out-and-back days, loops, and a few multi-day expeditions towards the edges. The baseline for a real project: how far short of the territory do the footprint and the extent land when only a settlement's surroundings are walked?`,
        make(rng) {

          return finish({

      {
        name: "Two territories",

          "Two community territories of 100 to 1,000 km², each with its own settlement and trips, far enough apart not to touch. The extent should find two clusters, keep both, and leave the land between them out.",
        make(rng) {
          const areaA = 10 ** (2 + rng());
          const areaB = 10 ** (2 + rng());
          const separation =
            2.5 *

      {

        make(rng) {

      {

        make(rng) {

        make(rng) {

              const days = [];
              for (let d = 0; d < dayCount; d++)

                    path: subPath(

        make(rng) {

        make(rng) {

            ],

            path: ring.slice(i * third, Math.min(ring.length, (i + 1) * third + 1)),
            day: 60 + 7 * i
          }));
          const walks = days.map(({path, day}) => ({

              count: 6
            })
          }));
          return finish({
            points: [...kept.points, ...walks.flatMap((w) => w.points)],

              ...kept.tracks,
              ...walks.map((w) => ({
                device: "D",
                time: timeOfDay(w.day, 7),
                coords: jitterLine(rng, w.route, 5)
              }))
            ],
            territory: [shape.polygon],
            routes: [{kind: "loop", coords: ring}],
            collection:
              describeCollection(campaign) +
              ", plus three days walking the concession boundary"
          });
        }
      }
    ];

  <script id="60" type="module" pinned="">
    // Every scenario draws from the notebook's seed mixed with its own number, so one
    // seed regenerates the whole catalogue.
    function makeScenario(spec, seed) {
      return {
        name: spec.name,
        tests: spec.tests,
        seed,
        ...spec.make(seededRandom((seed * 1000003 + spec.seed) >>> 0))
      };
    }
  </script>
  <script id="61" type="text/markdown">
    ## Records for the estimators

    The estimator notebooks do not read scenarios directly; they build a record list from one. `buildRecords` turns observations and tracks into records in longitude and latitude and, when the implied-path option is on, joins consecutive observations by one device on one day (closer than a time gap and a distance) into a path treated like a track. That join is the one piece of the pipeline that works on the records as stored.

    `projectRecords` is the crossing into estimator metres: it derives one projection from the record set and keeps it alongside the projected records, so everything downstream (the estimators and the map) uses the same frame. `samplesAlong` turns projected records into observation positions plus points every given step along each track, sorted so nothing downstream depends on record order. `accumulationSteps` replays a scenario in time order for the accumulation curves.
  </script>
  <script id="62" type="module" pinned="">
    // Consecutive observations by the same device on the same UTC day, closer in
    // time than the gap and closer in space than the distance, are joined into a path.
    function impliedPaths(points, gapHours, maxKm) {
      const gapMs = gapHours * 3600 * 1000;
      const maxM = maxKm * 1000;
      const byDeviceAndDay = new Map();
      for (const p of points) {
        const key = `${p.device}|${Math.floor(p.time / DAY_MS)}`;
        if (!byDeviceAndDay.has(key)) byDeviceAndDay.set(key, []);
        byDeviceAndDay.get(key).push(p);
      }
      const paths = [];
      for (const key of [...byDeviceAndDay.keys()].sort()) {
        const dayPoints = byDeviceAndDay
          .get(key)
          .slice()
          .sort((a, b) => a.time - b.time || a.lon - b.lon || a.lat - b.lat);
        let run = [dayPoints[0]];
        const flush = () => {
          if (run.length > 1)
            paths.push({
              device: run[0].device,
              time: run[0].time,
              coords: run.map((p) => [p.lon, p.lat])
            });
        };
        for (let i = 1; i < dayPoints.length; i++) {
          const previous = dayPoints[i - 1];
          const next = dayPoints[i];
          const closeInTime = next.time - previous.time <= gapMs;
          const closeInSpace =
            lonLatDistanceM([previous.lon, previous.lat], [next.lon, next.lat]) <=
            maxM;
          if (closeInTime && closeInSpace) run.push(next);
          else {
            flush();
            run = [next];
          }
        }
        flush();
      }
      return paths;
    }

    function buildRecords(
      scenario,
      {impliedPaths: on = true, gapHours = 2, maxKm = 2} = {}
    ) {
      const points = scenario.points.map((p) => ({
        kind: "point",
        device: p.device,
        time: p.time,
        coords: [[p.lon, p.lat]]
      }));
      const tracks = scenario.tracks.map((t) => ({
        kind: "track",
        device: t.device,
        time: t.time,
        coords: t.coords
      }));
      const implied = on
        ? impliedPaths(scenario.points, gapHours, maxKm).map((t) => ({
            kind: "implied",
            ...t
          }))
        : [];
      return [...points, ...tracks, ...implied];
    }

    // The crossing from longitude and latitude into estimator metres. The projection is
    // returned with the records because everything downstream has to share this one frame.
    function projectRecords(records) {
      const projection = metresProjection(records.flatMap((r) => r.coords));
      const xyRecords = records.map((r) => ({
        ...r,
        xy: r.coords.map(projection.toMetres)
      }));
      return {projection, xyRecords};
    }

    // Observations plus every track sampled every stepM along each segment, tagged
    // with the record index and sorted so nothing downstream depends on record order.
    function samplesAlong(xyRecords, stepM) {
      const samples = [];
      xyRecords.forEach((record, index) => {
        const line = record.xy;
        if (line.length === 1)
          samples.push({x: line[0][0], y: line[0][1], record: index});
        for (let i = 0; i + 1 < line.length; i++) {
          const [x0, y0] = line[i];
          const [x1, y1] = line[i + 1];
          const steps = Math.max(
            1,
            Math.ceil(Math.hypot(x1 - x0, y1 - y0) / stepM)
          );
          for (let k = 0; k <= steps; k++)
            samples.push({
              x: x0 + ((x1 - x0) * k) / steps,
              y: y0 + ((y1 - y0) * k) / steps,
              record: index
            });
        }
      });
      samples.sort((a, b) => a.x - b.x || a.y - b.y || a.record - b.record);
      // Adjacent segments share a vertex, so drop repeated positions from the same record.
      return samples.filter(
        (s, i) =>
          i === 0 ||
          s.x !== samples[i - 1].x ||
          s.y !== samples[i - 1].y ||
          s.record !== samples[i - 1].record
      );
    }

    // The scenario as it stood after the first n records in time order, for n in
    // `steps` even shares of the total. Both estimator notebooks draw their
    // accumulation curve by running the estimator over this list.
    function accumulationSteps(scenario, steps = 16) {
      const ordered = [
        ...scenario.points.map((p) => ({kind: "point", ...p})),
        ...scenario.tracks.map((t) => ({kind: "track", ...t}))
      ].sort((a, b) => a.time - b.time);
      const counts = new Set();
      for (let i = 1; i <= steps; i++) {
        const n = Math.round((ordered.length * i) / steps);
        if (n > 0) counts.add(n);
      }
      return [...counts].map((records) => {
        const subset = ordered.slice(0, records);
        return {
          records,
          scenario: {
            ...scenario,
            points: subset.filter((r) => r.kind === "point"),
            tracks: subset.filter((r) => r.kind === "track")
          }
        };
      });
    }

    // A unit outline centred on the origin. "natural" wobbles like ridges and river
    // bends; "polygon" has 4 to 7 vertices as a technical mapper would draw between
    // neighbouring titles; "square" is a square.
    function unitOutline(rng, kind) {
      if (kind === "square")
        return [
          [-1, -1],
          [1, -1],
          [1, 1],
          [-1, 1]
        ];
      if (kind === "polygon") {
        const n = 4 + Math.floor(rng() * 4);
        const phase = rng() * 2 * Math.PI;
        const outline = [];
        for (let i = 0; i < n; i++) {
          const angle = phase + ((i + (rng() - 0.5) * 0.7) * 2 * Math.PI) / n;
          const radius = 0.6 + rng() * 0.4;
          outline.push([radius * Math.cos(angle), radius * Math.sin(angle)]);
        }
        return outline;
      }
      const harmonics = [2, 3, 4, 5, 6].map((k) => ({
        k,
        amplitude: (0.04 + rng() * 0.1) / (k <= 3 ? 1 : 1.5),
        phase: rng() * 2 * Math.PI
      }));
      const outline = [];
      for (let i = 0; i < 160; i++) {
        const theta = (i / 160) * 2 * Math.PI;
        let r = 1;
        for (const h of harmonics)
          r += h.amplitude * Math.sin(h.k * theta + h.phase);
        outline.push([
          Math.max(0.3, r) * Math.cos(theta),
          Math.max(0.3, r) * Math.sin(theta)
        ]);
      }
      return outline;
    }

    function randomKind(rng) {
      const roll = rng();
      return roll < 0.45 ? "natural" : roll < 0.85 ? "polygon" : "square";
    }

    // Aspect ratios lean towards round but reach 4 (a long thin territory).
    function randomAspect(rng) {
      return 1 + rng() * rng() * 3;
    }

    // Community territories run from 100 to 10,000 km² with a median near 2,000 km².
    function communityAreaKm2(rng) {
      return 10 ** (2 + 2 * rng() ** 0.6);
    }

    // A territory of the given area. `local` is the unrotated outline centred on the
    // origin with its long axis along x, so routes can be laid out in that frame and
    // mapped through `toMetres`, which applies the rotation and the centre.
    function territoryShape(
      rng,
      {
        areaKm2,
        kind = randomKind(rng),
        aspect = randomAspect(rng),
        rotation = rng() * Math.PI,
        centreM = [0, 0]
      }
    ) {
      const stretched = unitOutline(rng, kind).map(([x, y]) => [
        x * Math.sqrt(aspect),
        y / Math.sqrt(aspect)
      ]);
      const scale = Math.sqrt((areaKm2 * KM2) / polygonAreaM2(stretched));
      const local = stretched.map(([x, y]) => [x * scale, y * scale]);
      const cos = Math.cos(rotation);
      const sin = Math.sin(rotation);
      const toMetres = ([x, y]) => [
        centreM[0] + x * cos - y * sin,
        centreM[1] + x * sin + y * cos
      ];
      const polygon = local.map(toMetres);
      return {
        kind,
        aspect,
        rotation,
        centreM,
        local,
        toMetres,
        polygon,
        areaKm2: polygonAreaM2(polygon) / KM2,
        localBounds: boundsOf(local)
      };
    }

    function uniformInPolygon(rng, polygon, count, minSeparationM = 0) {
      const {minX, maxX, minY, maxY} = boundsOf(polygon);
      const points = [];
      let attempts = 0;
      while (points.length < count && attempts++ < 100000) {
        const x = minX + rng() * (maxX - minX);
        const y = minY + rng() * (maxY - minY);
        if (!pointInPolygon(x, y, polygon)) continue;
        if (points.some(([px, py]) => Math.hypot(px - x, py - y) < minSeparationM))
          continue;
        points.push([x, y]);
      }
      return points;
    }

    // A settlement somewhere in the inner part of a territory.
    function settlementIn(rng, shape) {
      const inner = shape.local.map(([x, y]) => shape.toMetres([x * 0.5, y * 0.5]));
      return uniformInPolygon(rng, inner, 1)[0];
    }
